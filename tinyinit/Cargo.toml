[package]
name = "tinyinit"
version = "0.1.0"
edition = "2024"
publish = false

# Independent of the Windows-only parent workspace.
[workspace]

[features]
default = ["embedded-rootfs"]
embedded-rootfs = []

[dependencies]
anyhow = "1"
brush-core = "0.5"
brush-builtins = "0.2"
brush-interactive = { version = "0.4", features = ["basic"] }
data-encoding = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
# Built for the CPU features .cargo/config.toml enables.
tinyssh = { git = "https://github.com/mjsabby/tinyssh", rev = "552dd3959507bbcf474fd8bad74f80f23e8f8576" }
tokio = { version = "1", features = ["full"] }
zstd = { version = "0.13", default-features = false }
uucore = "0.12"
# Every utility uutils builds for Linux with musl (its feat_os_unix_musl set).
# build.rs turns these uu_* dependencies into the applet table.
uu_arch = "0.12"
uu_b2sum = "0.12"
uu_base32 = "0.12"
uu_base64 = "0.12"
uu_basename = "0.12"
uu_basenc = "0.12"
uu_cat = "0.12"
uu_chgrp = "0.12"
uu_chmod = "0.12"
uu_chown = "0.12"
uu_chroot = "0.12"
uu_cksum = "0.12"
uu_comm = "0.12"
uu_cp = "0.12"
uu_csplit = "0.12"
uu_cut = "0.12"
uu_date = "0.12"
uu_dd = "0.12"
uu_df = "0.12"
uu_dir = "0.12"
uu_dircolors = "0.12"
uu_dirname = "0.12"
uu_du = "0.12"
uu_echo = "0.12"
uu_env = "0.12"
uu_expand = "0.12"
uu_expr = "0.12"
uu_factor = "0.12"
uu_false = "0.12"
uu_fmt = "0.12"
uu_fold = "0.12"
uu_groups = "0.12"
uu_head = "0.12"
uu_hostid = "0.12"
uu_hostname = "0.12"
uu_id = "0.12"
uu_install = "0.12"
uu_join = "0.12"
uu_kill = "0.12"
uu_link = "0.12"
uu_ln = "0.12"
uu_logname = "0.12"
uu_ls = "0.12"
uu_md5sum = "0.12"
uu_mkdir = "0.12"
uu_mkfifo = "0.12"
uu_mknod = "0.12"
uu_mktemp = "0.12"
uu_more = "0.12"
uu_mv = "0.12"
uu_nice = "0.12"
uu_nl = "0.12"
uu_nohup = "0.12"
uu_nproc = "0.12"
uu_numfmt = "0.12"
