# tinyssh, the SSH server, is compiled for x86-64 with AVX2, BMI2, ADX, AES-NI,
# PCLMULQDQ, VAES, VPCLMULQDQ and SHA-NI (AMD Zen 3+, Intel Ice Lake+), checks
# nothing at run time, and refuses to build without these features. They apply
# to the whole binary, PID 1 included: the guest's CPU must have them.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "target-feature=+aes,+pclmulqdq,+vaes,+vpclmulqdq,+sha,+adx"]